name: Flutter CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: exam_prep_app
      - name: Run tests
        run: flutter test
        working-directory: exam_prep_app
